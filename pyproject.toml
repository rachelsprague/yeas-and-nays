[project]
name = "yeas-and-nays"
version = "0.1.0"
description = "Data pipeline for U.S. House and Senate roll call votes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atproto>=0.0.55",
    "dbt-duckdb>=1.9",
    "defusedxml>=0.7",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyarrow>=17",
]

[project.scripts]
yan = "yan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
