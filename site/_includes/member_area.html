{%- assign a = include.area -%}
<li>
  <span class="m-area" data-button data-tab="area" data-value="{{ a.slug | escape }}">
    <span class="small nums"><span>{{ a.area | escape }}</span><span>{{ a.count }}</span></span>
    <span class="area-top-bar" aria-hidden="true"><span style="width: {{ a.pct | escape }}%"></span></span>
  </span>
</li>
