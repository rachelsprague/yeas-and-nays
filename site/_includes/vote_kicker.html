{%- assign v = include.vote -%}
<div class="kicker accent nums">{{ v.chamber_name }} · Roll {{ v.roll_number }} · {{ v.vote_date | ap_date }}</div>
<div class="question">{{ v.question }}{% if v.measure_label %}{% unless v.question contains v.measure_label %} · {{ v.measure_label }}{% endunless %}{% endif %}</div>
