{%- assign v = include.vote -%}
<div class="kicker muted nums">{{ v.chamber_name }} · Roll {{ v.roll_number }} · {{ v.vote_date | ap_date }}</div>
<div class="question">{{ v.question | escape }}{% if v.measure_label %}{% unless v.question contains v.measure_label %} · {{ v.measure_label | escape }}{% endunless %}{% endif %}</div>
