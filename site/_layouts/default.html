<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/brand/favicon/apple-touch-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>document.documentElement.classList.add("has-js")</script>
  <script src="/assets/js/filters.js" defer></script>
  {%- if jekyll.environment == "production" %}
  <script>
    // ?notrack=1 opts this browser out of Umami until ?notrack=0 (Umami's own
    // localStorage switch, so it lasts across visits).
    (function () {
      try {
        var notrack = new URLSearchParams(location.search).get("notrack");
        if (notrack === "1") localStorage.setItem("umami.disabled", "1");
        if (notrack === "0") localStorage.removeItem("umami.disabled");
      } catch (e) {}
    })();
  </script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="44cd1970-0a63-4dc1-bcb2-3ee6b458d843" data-domains="yeasandnaysdata.com" data-do-not-track="true"></script>
  {%- endif %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include masthead.html large=page.large_masthead %}
  {{ content }}
  {% include footer.html %}
</body>
</html>
