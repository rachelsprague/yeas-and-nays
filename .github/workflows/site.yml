name: Build and deploy site

# Rebuilds after every data update, and when the site itself changes.
on:
  workflow_run:
    workflows: ["Update vote data"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "src/yan/cards.py", "src/yan/fonts/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy in progress; queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After a data run, only when it succeeded (a failed dbt test means no new data).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The deploy doesn't need the test gems (tests run in test.yml).
    env:
      BUNDLE_WITHOUT: test
    steps:
      # ref: main picks up the data commit the update run just pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: site

      # Vote pages' link card images (site/assets/cards/, not committed), drawn
      # before the build so it copies them and points each vote page at its own.
      # No uv cache: the deploy installs nothing another workflow saved.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Link cards
        run: |
          uv sync --locked --no-dev
          uv run yan cards

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        working-directory: site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      # Site search: Pagefind reads the built pages and writes its index (and
      # the search page's script) to _site/pagefind/. npm ci installs it from
      # site/package-lock.json, pinned by hash, with no install scripts. Node
      # and npm come with the ubuntu-latest runner.
      - name: Search index
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install pagefind --site _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
