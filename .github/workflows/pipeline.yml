name: Update vote data

on:
  # Started hourly by an external scheduler (cron-job.org) through the
  # workflow_dispatch API. GitHub's own `schedule` trigger ran hours late or
  # not at all for this repo, which an hourly job can't absorb.
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a run that's still posting must finish (and commit its
# bot state) before the next one starts.
concurrency:
  group: update-vote-data
  cancel-in-progress: false

jobs:
  update:
    # Only main: a dispatch on a PR branch would run unmerged code with the
    # secrets (and post, if publishing is on), then push the branch onto main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # No token in .git/config: ingest, dbt and the bot run third-party code.
      # Only "Commit data" gets the write token, for its own pull and push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      # Raw downloads aren't committed. Caching them between runs keeps ingest
      # incremental, so each run fetches only new and recent votes.
      - name: Restore raw data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # The Congress.gov key (CRS bill summaries) is passed to this step only,
      # and sent only as a request header.
      - name: Ingest
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: uv run yan ingest

      - name: Stage
        run: uv run yan stage

      # Any failing dbt test stops the run here, before export and the bot,
      # so bad data never reaches data/out or Bluesky. Warnings don't fail.
      - name: dbt build (models + tests)
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build

      - name: Export JSON
        run: uv run yan export

      # Dry run unless the BOT_PUBLISH repository variable is "true". A dry
      # run prints posts to this log and never advances state. Credentials
      # are passed only to this step and only when publishing.
      - name: Bot
        id: bot
        env:
          BOT_PUBLISH: ${{ vars.BOT_PUBLISH }}
          BLUESKY_HANDLE: ${{ vars.BOT_PUBLISH == 'true' && secrets.BLUESKY_HANDLE || '' }}
          BLUESKY_APP_PASSWORD: ${{ vars.BOT_PUBLISH == 'true' && secrets.BLUESKY_APP_PASSWORD || '' }}
        run: |
          if [ "$BOT_PUBLISH" = "true" ]; then
            uv run yan bot run --publish
          else
            uv run yan bot run
          fi

      # Also runs if the bot step failed partway, so state for anything
      # already posted is saved and not posted again.
      - name: Commit data
        if: success() || steps.bot.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        # The token goes in a one-off auth header (as checkout sets it), never
        # in a URL or saved git config. Hooks and fsmonitor are off, the
        # simplest way for an earlier step to run code here; other git config
        # and env routes remain until this step moves to a job of its own.
        run: |
          safe_git() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          safe_git add data/out data/bot/state.json
          if safe_git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          safe_git config user.name "github-actions[bot]"
          safe_git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          safe_git commit -m "Update vote data"
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$b64"
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $b64"
          safe_git -c "$auth" pull --rebase origin main
          safe_git -c "$auth" push origin HEAD:main
