name: yeas_and_nays
version: "0.1.0"
config-version: 2
profile: yeas_and_nays

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The Congress in session (CONGRESS in src/yan/config.py). Every Congress on the
  # site, with its dates, is in seeds/congresses.csv.
  congress: 119

models:
  yeas_and_nays:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

data_tests:
  yeas_and_nays:
    marts:
      # The floor schedule is secondary: its data problems warn rather than
      # stop the run before votes are exported and posted.
      floor:
        +severity: warn
