version: 2

models:
  - name: stg_legislators__social_media
    description: >
      One row per member in congress-legislators' social media file, with links built from
      the recorded account names. A repeated member would be deduplicated in `members`, so
      these tests flag it; they warn because the accounts are secondary to votes.
    columns:
      - name: bioguide_id
        data_tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

  - name: stg_floor__senate_actions
    description: >
      One row per status line in the Senate's daily floor activity. Every document there has
      a docnum; `floor_schedule` drops a cloture event without one (it can't be told apart
      from another), so this test is where it shows; it warns because the floor schedule is
      secondary to votes.
    columns:
      - name: docnum
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: stg_floor__senate_session_days
    description: >
      One row per time the Senate convened, from its session days file. `senate_sessions`
      drops a row whose convene time didn't parse, so this test is where it shows; it
      warns because the floor schedule is secondary to votes.
    columns:
      - name: convene_time_et
        data_tests:
          - not_null:
              config:
                severity: warn
