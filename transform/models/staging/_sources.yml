version: 2

sources:
  - name: staged
    description: >
      Parquet files written by `yan stage` from the raw downloads. Values are
      kept as recorded (strings); staging models cast and rename them.
    meta:
      external_location: "../data/staged/{name}.parquet"
    tables:
      - name: house_votes
        description: One row per House roll call, from clerk.house.gov/evs XML.
      - name: house_positions
        description: One row per member per House roll call.
      - name: senate_votes
        description: One row per Senate roll call, from senate.gov LIS XML.
      - name: senate_positions
        description: One row per senator per Senate roll call.
      - name: bills
        description: >
          One row per bill or resolution with a recorded vote, from the Congress.gov API bill
          endpoint: sponsor, introduced date, cosponsor count.
      - name: sponsored_bills
        description: >
          One row per bill or resolution a member introduced this Congress, from the
          Congress.gov API member sponsored-legislation endpoint.
      - name: cosponsored_bills
        description: >
          One row per bill or resolution a member cosponsored this Congress, from the
          Congress.gov API member cosponsored-legislation endpoint.
      - name: cosponsored_lists
        description: >
          One row per member whose cosponsored-legislation list has been fetched, with the
          number of this Congress's bills and resolutions on it.
      - name: bill_summaries
        description: >
          One row per Congressional Research Service summary (one per bill version), from the
          Congress.gov API, for bills and resolutions with a recorded vote.
      - name: house_floor_items
        description: >
          One row per item on the House Majority Leader's weekly floor schedule
          (docs.house.gov), for this week and next when published.
      - name: senate_floor_actions
        description: >
          One row per status line on each bill, amendment or nomination in the Senate's daily
          floor activity (senate.gov), for the most recent session days.
      - name: senate_session_days
        description: One row per time the Senate convened this session, from senate.gov.
      - name: legislators
        description: One row per person in unitedstates/congress-legislators (current + historical).
      - name: legislator_terms
        description: >
          One row per term served, with the official website, contact form, phone, and
          Washington office recorded for that term.
      - name: legislator_party_affiliations
        description: Party periods within a term, present only when a member changed party mid-term.
      - name: legislator_social_media
        description: >
          One row per current member in congress-legislators' social media file: official
          account names on X (recorded as twitter), Facebook, Instagram, YouTube, and Mastodon.
