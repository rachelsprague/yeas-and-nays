version: 2

# Sources are external Parquet files that dbt can't introspect for column
# types, so their fixtures are SQL with every column given.
unit_tests:
  - name: social_media_links_built_from_account_names
    description: >
      Each account name becomes a link. YouTube prefers the channel ID, and a
      channel ID recorded as the username also links to the channel. A value
      that doesn't look like an account name gets no link.
    model: stg_legislators__social_media
    given:
      - input: source('staged', 'legislator_social_media')
        format: sql
        rows: |
          select * from (values
              ('A1', 'SenExample', 'senator.example', 'sen_example', 'SenExample', 'UCabcdefghijklmnopqrstuv', '@SenExample@Example.Social', 'Example.senate.gov'),
              ('A2', null, '8037068318', null, '@repexample', null, null, 'rep-example.bsky.social'),
              ('A3', null, null, null, 'UCabcdefghijklmnopqrstuv', null, null, null),
              ('A4', 'bad handle', 'x"><script>', 'a/b', 'a b', null, 'not-an-address', 'example.com/x')
          ) as t (bioguide_id, twitter, facebook, instagram, youtube, youtube_id, mastodon, bluesky)
    expect:
      rows:
        - {bioguide_id: A1, x_url: "https://x.com/SenExample", facebook_url: "https://www.facebook.com/senator.example", instagram_url: "https://www.instagram.com/sen_example", youtube_url: "https://www.youtube.com/channel/UCabcdefghijklmnopqrstuv", mastodon_url: "https://example.social/@SenExample", bluesky_url: "https://bsky.app/profile/example.senate.gov"}
        - {bioguide_id: A2, x_url: null, facebook_url: "https://www.facebook.com/8037068318", instagram_url: null, youtube_url: "https://www.youtube.com/@repexample", mastodon_url: null, bluesky_url: "https://bsky.app/profile/rep-example.bsky.social"}
        - {bioguide_id: A3, x_url: null, facebook_url: null, instagram_url: null, youtube_url: "https://www.youtube.com/channel/UCabcdefghijklmnopqrstuv", mastodon_url: null, bluesky_url: null}
        - {bioguide_id: A4, x_url: null, facebook_url: null, instagram_url: null, youtube_url: null, mastodon_url: null, bluesky_url: null}

  - name: terms_leave_out_malformed_links
    model: stg_legislators__terms
    given:
      - input: source('staged', 'legislator_terms')
        format: sql
        rows: |
          select * from (values
              ('A1', 'sen', 'https://www.example.senate.gov', 'hhttps://www.example.senate.gov/contact'),
              ('A2', 'rep', 'javascript:alert(1)', 'https://example.house.gov/"contact')
          ) as t (bioguide_id, term_type, url, contact_form),
          (select
              null::varchar as term_start, null::varchar as term_end, null::varchar as state,
              null::bigint as district, null::varchar as party, null::varchar as caucus,
              null::varchar as phone, null::varchar as office)
    expect:
      rows:
        - {bioguide_id: A1, website_url: "https://www.example.senate.gov", contact_form_url: null}
        - {bioguide_id: A2, website_url: null, contact_form_url: null}

  - name: house_actions_split_out_decisions_without_a_roll_call
    description: >
      The question and outcome are read from lines that record a final decision by voice
      vote or without objection. Recorded votes, postponed votes, and voice votes on other
      questions have neither.
    model: stg_floor__house_actions
    given:
      - input: source('staged', 'house_floor_actions')
        format: sql
        rows: |
          select *, '119' as congress, 'H37300' as action_code, '20261118T17:41:31' as action_time, 'H.R. 1' as measure_number,
              'hr' as bill_type, '1' as bill_number, 'house_days/2026-11-18.xml' as source_file
          from (values
              ('1', 'On motion to suspend the rules and pass the bill, as amended Agreed to by voice vote.'),
              ('2', 'On motion that the House suspend the rules and agree to the Senate amendment Agreed to by voice vote.'),
              ('3', 'On agreeing to the resolution Agreed to without objection.'),
              ('4', 'On passage Passed by voice vote.'),
              ('5', 'On motion to suspend the rules and pass the bill Agreed to by the Yeas and Nays: (2/3 required): 300 - 100 (Roll no. 1).'),
              ('6', 'POSTPONED PROCEEDINGS - the Chair put the question on passage of the bill and by voice vote announced the ayes had prevailed.'),
              ('7', 'Motion to reconsider laid on the table Agreed to without objection.'),
              ('8', 'On agreeing to the Smith amendment Agreed to by voice vote.'),
              ('9', null)
          ) as t (action_id, action_text)
    expect:
      rows:
        - {action_id: "1", question: "On motion to suspend the rules and pass the bill, as amended", outcome: Agreed to by voice vote}
        - {action_id: "2", question: On motion that the House suspend the rules and agree to the Senate amendment, outcome: Agreed to by voice vote}
        - {action_id: "3", question: On agreeing to the resolution, outcome: Agreed to without objection}
        - {action_id: "4", question: On passage, outcome: Passed by voice vote}
        - {action_id: "5", question: null, outcome: null}
        - {action_id: "6", question: null, outcome: null}
        - {action_id: "7", question: null, outcome: null}
        - {action_id: "8", question: null, outcome: null}
        - {action_id: "9", question: null, outcome: null}
