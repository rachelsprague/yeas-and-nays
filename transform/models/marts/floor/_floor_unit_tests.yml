version: 2

unit_tests:
  - name: floor_schedule_drops_cloture_events_with_no_docnum
    description: >
      Cloture events with no docnum (a malformed floor record) can't be told apart, so
      they're left out rather than grouped into one item with a null ID. Item IDs are
      lower case with hyphens.
    model: floor_schedule
    given:
      - input: ref('stg_floor__house_items')
        rows:
          - {congress: 119, week_date: 2026-11-09, item_id: "4098.1 a", measure_number: H.R. 5, bill_type: hr, bill_number: "5", title: A, removed_at_recorded: null}
      - input: ref('int_senate_cloture_events')
        rows:
          - {docnum: null, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-09, status_order: 0, document_title: N1}
          - {docnum: null, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-10, status_order: 0, document_title: N2}
          - {docnum: PN7, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-10, status_order: 1, document_title: N7}
      - input: ref('int_votes_unioned')
        rows:
          - {vote_id: s119-2-0001, chamber: senate, congress: 119, measure_number: PN1, question: On the Cloture Motion PN1, vote_date: 2026-11-04, vote_time_et: "2026-11-04 12:00:00"}
    expect:
      rows:
        - {item_id: h-2026-11-09-4098-1-a, title: A}
        - {item_id: s-pn7, title: N7}

  - name: floor_schedule_ids_written_two_ways_give_one_item
    description: >
      The source can write an ID two ways ("4098.1"/"4098-1", "H.R. 4"/"H.R.4"), which give the
      same item ID, so they make one item rather than two rows with that ID: for the House the
      first in raw order, for the Senate the latest filing.
    model: floor_schedule
    given:
      - input: ref('stg_floor__house_items')
        rows:
          - {congress: 119, week_date: 2026-11-09, item_id: "4098.1", measure_number: H.R. 5, bill_type: hr, bill_number: "5", title: Dot, removed_at_recorded: null}
          - {congress: 119, week_date: 2026-11-09, item_id: "4098-1", measure_number: H.R. 5, bill_type: hr, bill_number: "5", title: Hyphen, removed_at_recorded: null}
      - input: ref('int_senate_cloture_events')
        rows:
          - {docnum: H.R. 4, document_prefix: HR, target: the measure, event: filed, activity_date: 2026-11-09, status_order: 0, document_title: Earlier}
          - {docnum: H.R.4, document_prefix: HR, target: the measure, event: filed, activity_date: 2026-11-10, status_order: 0, document_title: Later}
      - input: ref('int_votes_unioned')
        rows:
          - {vote_id: s119-2-0001, chamber: senate, congress: 119, measure_number: PN1, question: On the Cloture Motion PN1, vote_date: 2026-11-04, vote_time_et: "2026-11-04 12:00:00"}
    expect:
      rows:
        - {item_id: h-2026-11-09-4098-1, title: Hyphen}
        - {item_id: s-h-r-4-measure, title: Later}

  - name: floor_schedule_senate_same_line_filings_pick_the_first_docnum
    description: >
      Two spellings of a docnum filed on the same day in the same status order tie on the
      latest filing; the first docnum is kept ("H.R. 4" before "H.R.4"), then the first
      title, whatever their raw order.
    model: floor_schedule
    given:
      - input: ref('stg_floor__house_items')
        rows:
          - {congress: 119, week_date: 2026-11-09, item_id: "4098.1", measure_number: H.R. 5, bill_type: hr, bill_number: "5", title: A, removed_at_recorded: null}
      - input: ref('int_senate_cloture_events')
        rows:
          - {docnum: H.R.4, document_prefix: HR, target: the measure, event: filed, activity_date: 2026-11-10, status_order: 0, document_title: No space}
          - {docnum: H.R. 4, document_prefix: HR, target: the measure, event: filed, activity_date: 2026-11-10, status_order: 0, document_title: Space}
          - {docnum: PN8, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-10, status_order: 1, document_title: Z}
          - {docnum: PN8, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-10, status_order: 1, document_title: Y}
      - input: ref('int_votes_unioned')
        rows:
          - {vote_id: s119-2-0001, chamber: senate, congress: 119, measure_number: PN1, question: On the Cloture Motion PN1, vote_date: 2026-11-04, vote_time_et: "2026-11-04 12:00:00"}
    expect:
      rows:
        - {item_id: h-2026-11-09-4098-1, measure_number: H.R. 5, title: A}
        - {item_id: s-h-r-4-measure, measure_number: H.R. 4, title: Space}
        - {item_id: s-pn8, measure_number: PN8, title: Y}

  - name: floor_schedule_ids_skip_an_all_punctuation_part
    description: >
      A target with no letters or digits is left out of the item ID rather than leaving a
      hyphen at its end. A House item ID or Senate docnum with none is dropped, like a
      missing docnum, rather than giving a bare "h-<week>" or "s" that two such items
      would share.
    model: floor_schedule
    given:
      - input: ref('stg_floor__house_items')
        rows:
          - {congress: 119, week_date: 2026-11-09, item_id: "--", measure_number: H.R. 5, bill_type: hr, bill_number: "5", title: A, removed_at_recorded: null}
          - {congress: 119, week_date: 2026-11-09, item_id: null, measure_number: H.R. 7, bill_type: hr, bill_number: "7", title: C, removed_at_recorded: null}
          - {congress: 119, week_date: 2026-11-09, item_id: "4098.2", measure_number: H.R. 6, bill_type: hr, bill_number: "6", title: B, removed_at_recorded: null}
      - input: ref('int_senate_cloture_events')
        rows:
          - {docnum: PN8, document_prefix: PN, target: "..", event: filed, activity_date: 2026-11-10, status_order: 0, document_title: N8}
          - {docnum: "..", document_prefix: PN, target: "", event: filed, activity_date: 2026-11-10, status_order: 1, document_title: N9}
      - input: ref('int_votes_unioned')
        rows:
          - {vote_id: s119-2-0001, chamber: senate, congress: 119, measure_number: PN1, question: On the Cloture Motion PN1, vote_date: 2026-11-04, vote_time_et: "2026-11-04 12:00:00"}
    expect:
      rows:
        - {item_id: h-2026-11-09-4098-2, title: B}
        - {item_id: s-pn8, title: N8}

  - name: floor_schedule_senate_compares_docnums_written_two_ways
    description: >
      A Senate docnum written two ways ("H.R. 4"/"H.R.4") is one document throughout: a
      cloture vote, withdrawal or disposal recorded under the other spelling ends the
      motion, a same-day vote under it marks a re-filing, and the roll call matches
      whichever way it writes the measure, nomination or amendment.
    model: floor_schedule
    given:
      - input: ref('stg_floor__house_items')
        rows:
          - {congress: 119, week_date: 2026-11-09, item_id: "4098.1", measure_number: H.R. 5, bill_type: hr, bill_number: "5", title: A, removed_at_recorded: null}
      - input: ref('int_senate_cloture_events')
        rows:
          # Voted under the other spelling: no longer pending.
          - {docnum: H.R. 4, document_prefix: HR, target: the measure, event: filed, activity_date: 2026-11-09, status_order: 0, document_title: Voted}
          - {docnum: H.R.4, document_prefix: HR, target: the measure, event: voted, activity_date: 2026-11-10, status_order: 0}
          # Disposed of under the other spelling: no longer pending.
          - {docnum: S.Res. 7, document_prefix: SRES, target: the measure, event: filed, activity_date: 2026-11-09, status_order: 1, document_title: Agreed to}
          - {docnum: S.Res.7, document_prefix: SRES, target: null, event: disposed, activity_date: 2026-11-10, status_order: 1}
          # Withdrawn under the other spelling: no longer pending.
          - {docnum: S. 11, document_prefix: S, target: the measure, event: filed, activity_date: 2026-11-09, status_order: 2, document_title: Withdrawn}
          - {docnum: S.11, document_prefix: S, target: the measure, event: withdrawn, activity_date: 2026-11-10, status_order: 2}
          # Pending, each matched to a roll call that writes it the other way.
          - {docnum: S. 9, document_prefix: S, target: the motion to proceed to the measure, event: filed, activity_date: 2026-11-10, status_order: 3, document_title: Proceed}
          - {docnum: S.Amdt. 6883, document_prefix: SA, target: amendment SA 6883, event: filed, activity_date: 2026-11-10, status_order: 4, document_title: Amendment}
          - {docnum: PN12-3, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-10, status_order: 5, document_title: Nomination}
          # Re-filed after that day's vote under the other spelling: that day's roll call is the earlier one.
          - {docnum: S.13, document_prefix: S, target: the measure, event: voted, activity_date: 2026-11-10, status_order: 6}
          - {docnum: S. 13, document_prefix: S, target: the measure, event: filed, activity_date: 2026-11-10, status_order: 7, document_title: Re-filed}
      - input: ref('int_votes_unioned')
        rows:
          - {vote_id: s119-2-0002, chamber: senate, congress: 119, measure_number: S.9, amendment_number: null, question: On Cloture on the Motion to Proceed S.9, vote_date: 2026-11-12, vote_time_et: "2026-11-12 12:00:00"}
          - {vote_id: s119-2-0003, chamber: senate, congress: 119, measure_number: null, amendment_number: S.Amdt.6883, question: On the Cloture Motion S.Amdt.6883, vote_date: 2026-11-12, vote_time_et: "2026-11-12 13:00:00"}
          - {vote_id: s119-2-0004, chamber: senate, congress: 119, measure_number: PN12 3, amendment_number: null, question: On the Cloture Motion PN12 3, vote_date: 2026-11-12, vote_time_et: "2026-11-12 14:00:00"}
          - {vote_id: s119-2-0005, chamber: senate, congress: 119, measure_number: S. 13, amendment_number: null, question: On the Cloture Motion S. 13, vote_date: 2026-11-10, vote_time_et: "2026-11-10 12:00:00"}
    expect:
      rows:
        - {item_id: h-2026-11-09-4098-1, vote_id: null}
        - {item_id: s-s-9-proceed, vote_id: s119-2-0002}
        - {item_id: s-s-amdt-6883, vote_id: s119-2-0003}
        - {item_id: s-pn12-3, vote_id: s119-2-0004}
        - {item_id: s-s-13-measure, vote_id: null}

  - name: floor_schedule_house_raw_id_listed_twice_keeps_the_first_listed
    description: >
      Two House rows with the same raw item ID in a week give one item, the one listed
      first on the schedule (by category, then position), whatever their raw order.
    model: floor_schedule
    given:
      - input: ref('stg_floor__house_items')
        rows:
          - {congress: 119, week_date: 2026-11-09, item_id: "4098.1", category_order: 1, item_order: 3, measure_number: H.R. 5, bill_type: hr, bill_number: "5", title: First, removed_at_recorded: null}
          - {congress: 119, week_date: 2026-11-09, item_id: "4098.1", category_order: 2, item_order: 0, measure_number: H.R. 5, bill_type: hr, bill_number: "5", title: Second, removed_at_recorded: null}
      - input: ref('int_senate_cloture_events')
        rows:
          - {docnum: PN8, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-10, status_order: 0, document_title: N8}
      - input: ref('int_votes_unioned')
        rows:
          - {vote_id: s119-2-0001, chamber: senate, congress: 119, measure_number: PN1, question: On the Cloture Motion PN1, vote_date: 2026-11-04, vote_time_et: "2026-11-04 12:00:00"}
    expect:
      rows:
        - {item_id: h-2026-11-09-4098-1, title: First}
        - {item_id: s-pn8, title: N8}
