version: 2

# Tests here warn instead of failing the build (see dbt_project.yml): the floor
# schedule is a secondary source, and a quirk in it must not stop the hourly
# run before votes are exported and posted.

models:
  - name: floor_schedule
    description: >
      What may come up for a vote, one row per item: measures on the House Majority Leader's
      weekly floor schedule, and Senate cloture motions filed and not yet voted on. Items
      are often moved or dropped; vote_id links the roll call that followed, if any.
    columns:
      - name: item_id
        data_tests: [unique, not_null]
      - name: chamber
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["house", "senate"]
      - name: week_date
        description: Monday of the House schedule's week. Null for Senate items.
        data_tests:
          - not_null:
              config:
                where: "chamber = 'house'"
      - name: filed_date
        description: Day the Senate cloture motion was filed. Null for House items.
        data_tests:
          - not_null:
              config:
                where: "chamber = 'senate'"
      - name: category
        description: The House schedule's heading for the item, e.g. "Items that may be considered under suspension of the rules".
        data_tests:
          - not_null:
              config:
                where: "chamber = 'house'"
      - name: question
        description: The Senate's question for the expected cloture vote. Null for House items.
        data_tests:
          - accepted_values:
              arguments:
                values: ["On the Cloture Motion", "On Cloture on the Motion to Proceed"]
      - name: measure_number
        description: The bill, resolution, amendment or nomination number as listed.
      - name: title
        data_tests: [not_null]
      - name: bill_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["hr", "s", "hres", "sres", "hjres", "sjres", "hconres", "sconres"]
      - name: vote_id
        description: The roll call on the item since it was scheduled or filed. Null until there is one.
        data_tests:
          - relationships:
              arguments:
                to: ref('votes')
                field: vote_id

  - name: senate_sessions
    description: Each time the Senate convened this session, and when it was set to convene next.
    columns:
      - name: convene_time_et
        data_tests: [unique, not_null]
