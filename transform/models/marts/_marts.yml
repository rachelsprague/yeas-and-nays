version: 2

models:
  - name: members
    description: >
      One row per member who served in the 119th Congress (House and Senate), plus anyone
      listed on a 119th roll call without a 119th term.
    columns:
      - name: bioguide_id
        description: Biographical Directory ID; the member key across both chambers.
        data_tests: [unique, not_null]
      - name: lis_id
        description: Senate LIS member ID, used to join Senate vote records. Null for House-only members.
        data_tests:
          - not_null:
              config:
                where: "chamber = 'senate'"
      - name: member_label
        description: Display label per STYLE.md, e.g. "Murkowski (R-AK)", "Lawler (R-NY-17)".
        data_tests: [not_null]
      - name: chamber
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["house", "senate"]
      - name: party
        description: Party code (R, D, I) for the member's most recent period of service.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["R", "D", "I"]
      - name: caucus_party
        description: Party the member caucuses with (independents grouped with their caucus).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["R", "D"]
      - name: served_in_congress
        description: >
          True when congress-legislators has a term overlapping the 119th Congress. False for
          someone listed on a 119th roll call without one (e.g. a member-elect who never took the seat).
        data_tests: [not_null]
      - name: served_from
        description: First day of service in the 119th Congress. Null when served_in_congress is false.
        data_tests:
          - not_null:
              config:
                where: served_in_congress
      - name: served_to
        description: Last day of service in the 119th Congress (the Congress's end date for sitting members).
        data_tests:
          - not_null:
              config:
                where: served_in_congress

  - name: member_stats
    description: >
      One row per member with a recorded position this Congress: participation and
      agreement with their caucus majority, as defined on the site's methodology page.
    columns:
      - name: bioguide_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: roll_calls
        description: Roll calls held in the member's chamber while they were in office.
        data_tests: [not_null]
      - name: votes_cast
        description: Roll calls with any recorded response other than Not Voting.
      - name: missed_votes_pct
        description: Not Voting as a percentage of roll_calls, to one decimal place.
        data_tests: [not_null]
      - name: with_party_majority_pct
        description: >
          Yes/no votes matching the caucus majority as a percentage of yes/no votes where
          the caucus had a majority. Null when the member cast no such vote.

  - name: votes
    description: One row per roll call vote in the House and Senate.
    columns:
      - name: vote_id
        description: "{h|s}{congress}-{session}-{roll number, 4 digits}, e.g. h119-1-0042."
        data_tests: [unique, not_null]
      - name: chamber
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["house", "senate"]
      - name: congress
        data_tests:
          - accepted_values:
              arguments:
                values: [119]
                quote: false
      - name: session
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: roll_number
        data_tests: [not_null]
      - name: vote_date
        data_tests: [not_null]
      - name: question
        description: Vote question as officially recorded.
        data_tests: [not_null]
      - name: result
        description: Result as officially recorded (for a Speaker election, the winning candidate).
        data_tests: [not_null]
      - name: yea_count
        description: Official tally. Null for votes tallied by candidate (Election of the Speaker).
      - name: tie_breaker_by
        description: Senate only. Set when the Vice President cast a tie-breaking vote.
      - name: source_url
        description: Official vote record on clerk.house.gov or senate.gov.
        data_tests: [not_null]
      - name: bill_type
        description: >
          Congress.gov bill type (hr, s, hres, sres, hjres, sjres, hconres, sconres) parsed from
          the recorded measure number. Null for nominations and questions with no bill.
        data_tests:
          - accepted_values:
              arguments:
                values: ["hr", "s", "hres", "sres", "hjres", "sjres", "hconres", "sconres"]
      - name: congress_gov_url
        description: The measure's page on Congress.gov. Null when bill_type is null.
        data_tests:
          - not_null:
              config:
                where: bill_type is not null
      - name: member_count
        description: Number of members with a recorded position on the vote.
      - name: against_party_majority_count
        description: Members who voted yes/no opposite to their caucus's majority.

  - name: bills
    description: >
      One row per bill or resolution with a recorded vote this Congress: sponsor, introduced
      date and cosponsor count, from Congress.gov.
    columns:
      - name: bill_id
        description: "{congress}-{bill_type}-{bill_number}, e.g. 119-hr-1013."
        data_tests: [unique, not_null]
      - name: sponsor_bioguide_id
        description: The member who introduced the measure. Null for the few measures with no sponsor.
        data_tests:
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: cosponsor_count
        description: Current cosponsors as of the latest fetch; cosponsors who withdrew are not counted.

  - name: sponsored_bills
    description: >
      One row per bill or resolution each member introduced this Congress, from Congress.gov,
      with its latest action and the most recent roll call vote on it, if any.
    columns:
      - name: bioguide_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: bill_id
        data_tests: [not_null]
      - name: bill_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["hr", "s", "hres", "sres", "hjres", "sjres", "hconres", "sconres"]
      - name: latest_vote_id
        description: The most recent roll call on the measure. Null when it hasn't had a recorded vote.
        data_tests:
          - relationships:
              arguments:
                to: ref('votes')
                field: vote_id

  - name: cosponsored_bills
    description: >
      One row per bill or resolution each member cosponsored this Congress, from Congress.gov,
      with its latest action and the most recent roll call vote on it, if any.
    columns:
      - name: bioguide_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: bill_id
        data_tests: [not_null]
      - name: bill_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["hr", "s", "hres", "sres", "hjres", "sjres", "hconres", "sconres"]
      - name: latest_vote_id
        description: The most recent roll call on the measure. Null when it hasn't had a recorded vote.
        data_tests:
          - relationships:
              arguments:
                to: ref('votes')
                field: vote_id

  - name: cosponsored_lists
    description: >
      One row per member whose Congress.gov cosponsored list has been fetched. Lists fill in
      over several runs; a member not listed here hasn't been fetched yet.
    columns:
      - name: bioguide_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: bill_count
        description: This Congress's bills and resolutions on the member's cosponsored list.
        data_tests: [not_null]

  - name: vote_summaries
    description: >
      For each vote on a bill or resolution with a Congressional Research Service summary,
      the summary of the version in effect on the vote date (else the earliest later one).
      Shown verbatim with its version and date.
    columns:
      - name: vote_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('votes')
                field: vote_id
      - name: action_desc
        description: The bill version summarized, as Congress.gov labels it (e.g. "Introduced in House").
        data_tests: [not_null]
      - name: action_date
        data_tests: [not_null]
      - name: summary_html
        description: CRS summary as published (HTML). Sanitized at export.
        data_tests: [not_null]

  - name: positions
    description: One row per member per vote.
    columns:
      - name: vote_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('votes')
                field: vote_id
      - name: bioguide_id
        description: Null only if a Senate LIS ID couldn't be matched; the relationships test fails in that case.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: member_label
        data_tests: [not_null]
      - name: position_raw
        description: Position as officially recorded (Yea, Aye, Nay, No, Present, Not Voting, or a candidate name).
        data_tests: [not_null]
      - name: position
        description: Normalized position.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["yes", "no", "present", "not_voting", "other"]
      - name: party
        description: Party in effect on the vote date, from congress-legislators.
        data_tests:
          - accepted_values:
              arguments:
                values: ["R", "D", "I"]
      - name: caucus_party
        description: Caucus in effect on the vote date; independents grouped with the party they caucus with.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["R", "D"]
      - name: term_covers_vote_date
        description: >
          False when the official record lists the member on a date outside their term dates in
          congress-legislators; party, caucus, and label then come from the nearest term.
        data_tests: [not_null]
      - name: caucus_majority_position
        description: The member's caucus majority on this vote (yes/no), or null on a tie or a non-yes/no vote.
        data_tests:
          - accepted_values:
              arguments:
                values: ["yes", "no"]
      - name: voted_against_party_majority
        description: >
          True when the member voted yes/no opposite to their caucus majority; false when
          with it; null when the member did not vote yes/no or the caucus had no majority.
