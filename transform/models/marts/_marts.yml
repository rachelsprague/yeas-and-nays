version: 2

models:
  - name: members
    description: >
      One row per member who served in a Congress on the site (the congresses seed; House
      and Senate), plus anyone listed on a roll call without a term in such a Congress.
    columns:
      - name: bioguide_id
        description: Biographical Directory ID; the member key across both chambers.
        data_tests: [unique, not_null]
      - name: lis_id
        description: Senate LIS member ID, used to join Senate vote records. Null for House-only members.
        data_tests:
          - not_null:
              config:
                where: "chamber = 'senate'"
      - name: member_label
        description: Display label per STYLE.md, e.g. "Murkowski (R-AK)", "Lawler (R-NY-17)".
        data_tests: [not_null]
      - name: chamber
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["house", "senate"]
      - name: party
        description: Party code (R, D, I) for the member's most recent period of service.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["R", "D", "I"]
      - name: caucus_party
        description: Party the member caucuses with (independents grouped with their caucus).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["R", "D"]
      - name: last_congress
        description: The latest Congress on the site the member served in or is recorded on a roll call in.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('congresses')
                field: congress
      - name: served_in_congress
        description: >
          True when congress-legislators has a term overlapping last_congress. False for someone
          listed on a roll call in it without one (e.g. a member-elect who never took the seat,
          or a returning member before congress-legislators adds their new term; chamber, state
          and party then come from their latest listed term).
        data_tests: [not_null]
      - name: served_from
        description: First day of service in last_congress. Null when served_in_congress is false.
        data_tests:
          - not_null:
              config:
                where: served_in_congress
      - name: served_to
        description: Last day of service in last_congress (the Congress's end date for sitting members).
        data_tests:
          - not_null:
              config:
                where: served_in_congress
      - name: chamber_terms
        description: >
          Terms begun so far in the member's latest chamber, every Congress included, from
          congress-legislators. A partial term after an appointment or special election counts
          as one. Null for someone with no term (served_in_congress false).
        data_tests:
          - not_null:
              config:
                where: served_in_congress
      - name: chamber_first_term_start
        description: Start of the member's first term in their latest chamber.
        data_tests:
          - not_null:
              config:
                where: served_in_congress
      - name: other_chamber_from_year
        description: >
          First and last year (other_chamber_to_year) of the member's service in the other
          chamber, before or after; null if none.
      - name: website_url
        description: >
          Official website from congress-legislators. This and the other official links below
          are null for members no longer in office, and for a value that isn't a well-formed link.
        data_tests:
          - not_null:
              config:
                where: is_current
                severity: warn
      - name: contact_form_url
        description: Official contact form, when congress-legislators lists one (mostly senators).
      - name: phone
        description: Washington office phone as recorded, e.g. "202-224-3441".
        data_tests:
          - not_null:
              config:
                where: is_current
                severity: warn
      - name: phone_tel
        description: The phone number for tel links ("+12022243441"); null unless it has 10 digits.
      - name: office
        description: Washington office as recorded, e.g. "511 Hart Senate Office Building".
      - name: x_url
        description: >
          Official account links built from the account names in congress-legislators' social
          media file (x_url, facebook_url, instagram_url, youtube_url, mastodon_url,
          bluesky_url). The file's other services, such as Threads, are not staged.

  - name: member_bios
    description: >
      One row per member with a biography in the newest Congressional Directory (GovInfo),
      matched by chamber, state and last name. Text is as printed: furnished or authorized
      by the member's office, per the directory.
    columns:
      - name: bioguide_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: edition
        description: GovInfo package ID of the directory edition, e.g. "CDIR-2026-02-20".
        data_tests: [not_null]
      - name: date_issued
        data_tests: [not_null]
      - name: opening
        description: >
          The biography's first part after the name and party, as printed, e.g. "of Oakland,
          CA; born in San Francisco, CA, January 29, 1977".
        data_tests: [not_null]
      - name: education
      - name: professional_history
      - name: military_service

  - name: member_stats
    description: >
      One row per member per Congress in which they have a recorded position: participation
      and agreement with their caucus majority, as defined on the site's methodology page.
      Unique per member and Congress (tests/member_congress_rows_unique.sql).
    columns:
      - name: bioguide_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: congress
        data_tests: [not_null]
      - name: roll_calls
        description: Roll calls held in the member's chamber while they were in office.
        data_tests: [not_null]
      - name: votes_cast
        description: Roll calls with any recorded response other than Not Voting.
      - name: missed_votes_pct
        description: Not Voting as a percentage of roll_calls, to one decimal place.
        data_tests: [not_null]
      - name: with_party_majority_pct
        description: >
          Yes/no votes matching the caucus majority as a percentage of yes/no votes where
          the caucus had a majority. Null when the member cast no such vote.

  - name: member_congresses
    description: >
      One row per member per Congress on the site that they served in or are recorded on a
      roll call in: dates of service and vote stats (the columns of member_stats, null when
      they have no recorded position in that Congress). Unique per member and Congress
      (tests/member_congress_rows_unique.sql).
    columns:
      - name: bioguide_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: congress
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('congresses')
                field: congress
      - name: served_in_congress
        description: >
          True when congress-legislators has a term overlapping this Congress. False for a
          member listed on one of its roll calls without one.
        data_tests: [not_null]
      - name: served_from
        description: First day of service in this Congress. Null when served_in_congress is false.
        data_tests:
          - not_null:
              config:
                where: served_in_congress
      - name: served_to
        description: Last day of service in this Congress (its end date for members serving through it).
        data_tests:
          - not_null:
              config:
                where: served_in_congress

  - name: votes
    description: One row per roll call vote in the House and Senate.
    columns:
      - name: vote_id
        description: "{h|s}{congress}-{session}-{roll number, 4 digits}, e.g. h119-1-0042."
        data_tests: [unique, not_null]
      - name: chamber
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["house", "senate"]
      - name: congress
        data_tests:
          - accepted_values:
              arguments:
                values: [119]
                quote: false
      - name: session
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: roll_number
        data_tests: [not_null]
      - name: vote_date
        data_tests: [not_null]
      - name: question
        description: Vote question as officially recorded.
        data_tests: [not_null]
      - name: result
        description: >
          Result as officially recorded. For a Speaker election, the candidate with the most
          votes, as the Clerk lists that member ("Johnson (LA)"), including on a ballot that
          elects no one.
        data_tests: [not_null]
      - name: result_bioguide_id
        description: >
          Speaker elections only: the member named in `result`, matched by the Clerk's display
          name among that roll call's voters. Null on other votes, and when the name matches no
          voter or more than one.
        data_tests:
          - not_null:
              config:
                severity: warn
                where: question = 'Election of the Speaker'
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: yea_count
        description: Official tally. Null for votes tallied by candidate (Election of the Speaker).
      - name: required_share
        description: >
          Share of the vote the question needed: 1/2, 3/5 or 2/3. Senate votes as recorded
          (majority_requirement); House votes two-thirds when the Clerk's vote type says so
          (expulsions included) or the question is one that needs it (suspend the rules, override
          a veto, propose a constitutional amendment), otherwise a majority. Null when
          no member voted yea or nay (quorum calls, Speaker elections).
        data_tests:
          - accepted_values:
              arguments:
                values: ["1/2", "3/5", "2/3"]
          - not_null:
              config:
                where: yea_count + nay_count > 0
      - name: yeas_needed
        description: >
          The fewest Yeas that carry the question: more than half, or at least two-thirds, of
          those voting yea or nay; three-fifths of the senators on the roll call (senators duly
          chosen and sworn) for 3/5, null when no senators are on the roll. Leaves out a Vice
          President's tie-breaking vote. Also null when it disagrees with the official result
          (carried short of it, or failed with it) and no tie was broken; the warning lists
          those votes, except known ones.
        data_tests:
          - not_null:
              config:
                # s119-1-0334: recorded as agreed to 51-48, 3/5 required (see votes.sql).
                where: required_share is not null and member_count > 0 and vote_id != 's119-1-0334'
                severity: warn
      - name: carried
        description: >
          Whether the question carried, read from the official result (Agreed to, Passed,
          Confirmed, Sustained, Well Taken; or Rejected, Failed, Defeated, or any result with
          "Not"). Null for a result that isn't a yes or no (Speaker elections); a warning
          lists any other result wording.
        data_tests:
          - not_null:
              config:
                where: required_share is not null
                severity: warn
      - name: tie_breaker_by
        description: Senate only. Set when the Vice President cast a tie-breaking vote.
      - name: source_url
        description: Official vote record on clerk.house.gov or senate.gov.
        data_tests: [not_null]
      - name: bill_type
        description: >
          Congress.gov bill type (hr, s, hres, sres, hjres, sjres, hconres, sconres) parsed from
          the recorded measure number. Null for nominations and questions with no bill.
        data_tests:
          - accepted_values:
              arguments:
                values: ["hr", "s", "hres", "sres", "hjres", "sjres", "hconres", "sconres"]
      - name: congress_gov_url
        description: The measure's page on Congress.gov. Null when bill_type is null.
        data_tests:
          - not_null:
              config:
                where: bill_type is not null
      - name: policy_area
        description: >
          CRS policy area of the measure (Congress.gov `policyArea`), e.g. "Health". Null for
          votes with no bill (nominations, quorum calls) and bills CRS hasn't assigned one yet.
      - name: member_count
        description: Number of members with a recorded position on the vote.
      - name: against_party_majority_count
        description: Members who voted yes/no opposite to their caucus's majority.

  - name: bills
    description: >
      One row per bill or resolution with a recorded vote this Congress: sponsor, introduced
      date and cosponsor count, from Congress.gov.
    columns:
      - name: bill_id
        description: "{congress}-{bill_type}-{bill_number}, e.g. 119-hr-1013."
        data_tests: [unique, not_null]
      - name: sponsor_bioguide_id
        description: The member who introduced the measure. Null for the few measures with no sponsor.
        data_tests:
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: sponsor_party
        description: The sponsor's party on the day the measure was introduced. Null with no sponsor.
        data_tests:
          - accepted_values:
              arguments:
                values: ["R", "D", "I"]
          - not_null:
              config:
                where: sponsor_bioguide_id is not null
      - name: sponsor_chamber
        description: The chamber the sponsor served in when the measure was introduced. Null with no sponsor.
      - name: sponsor_state
        description: The sponsor's state on the day the measure was introduced. Null with no sponsor.
      - name: sponsor_district
        description: The sponsor's House district on that day. Null in the Senate or with no sponsor.
      - name: cosponsor_count
        description: Current cosponsors as of the latest fetch; cosponsors who withdrew are not counted.

  - name: sponsored_bills
    description: >
      One row per bill or resolution each member introduced in each Congress on the site, from Congress.gov,
      with its latest action and the most recent roll call vote on it, if any.
    columns:
      - name: bioguide_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: bill_id
        data_tests: [not_null]
      - name: bill_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["hr", "s", "hres", "sres", "hjres", "sjres", "hconres", "sconres"]
      - name: latest_vote_id
        description: The most recent roll call on the measure. Null when it hasn't had a recorded vote.
        data_tests:
          - relationships:
              arguments:
                to: ref('votes')
                field: vote_id

  - name: cosponsored_bills
    description: >
      One row per bill or resolution each member cosponsored in each Congress on the site, from Congress.gov,
      with its latest action and the most recent roll call vote on it, if any.
    columns:
      - name: bioguide_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: bill_id
        data_tests: [not_null]
      - name: bill_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["hr", "s", "hres", "sres", "hjres", "sjres", "hconres", "sconres"]
      - name: latest_vote_id
        description: The most recent roll call on the measure. Null when it hasn't had a recorded vote.
        data_tests:
          - relationships:
              arguments:
                to: ref('votes')
                field: vote_id

  - name: sponsored_lists
    description: >
      One row per member per Congress whose Congress.gov sponsored list has been fetched. A fetch that
      fails leaves no list; a member and Congress not listed here haven't been fetched yet.
      Unique per member and Congress (tests/member_congress_rows_unique.sql).
    columns:
      - name: bioguide_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: bill_count
        description: That Congress's bills and resolutions on the member's sponsored list.
        data_tests: [not_null]

  - name: cosponsored_lists
    description: >
      One row per member per Congress whose Congress.gov cosponsored list has been fetched. Lists fill in
      over several runs; a member and Congress not listed here haven't been fetched yet.
      Unique per member and Congress (tests/member_congress_rows_unique.sql).
    columns:
      - name: bioguide_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: bill_count
        description: That Congress's bills and resolutions on the member's cosponsored list.
        data_tests: [not_null]

  - name: vote_summaries
    description: >
      For each vote on a bill or resolution with a Congressional Research Service summary,
      the summary of the version in effect on the vote date (else the earliest later one).
      Shown verbatim with its version and date.
    columns:
      - name: vote_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('votes')
                field: vote_id
      - name: action_desc
        description: The bill version summarized, as Congress.gov labels it (e.g. "Introduced in House").
        data_tests: [not_null]
      - name: action_date
        data_tests: [not_null]
      - name: summary_html
        description: CRS summary as published (HTML). Sanitized at export.
        data_tests: [not_null]

  - name: bill_milestones
    description: >
      One row per bill or resolution with a recorded vote per step it has reached on its
      path from introduction to law (introduced, committee report, passage or failure in
      each chamber, resolving differences, presented to the President, veto, override,
      became law), with the first and last date of that step. From the introduced date,
      Congress.gov actions recorded by the Library of Congress, and this site's roll calls.
    columns:
      - name: milestone_id
        description: bill_id and milestone, e.g. "119-hr-1:passed_house".
        data_tests: [unique, not_null]
      - name: bill_id
        data_tests: [not_null]
      - name: milestone
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [introduced, committee, passed_house, failed_house, passed_senate,
                         failed_senate, differences, differences_resolved, conference_report_house,
                         conference_report_senate, presented, vetoed, pocket_vetoed,
                         override_passed_house, override_failed_house, override_passed_senate,
                         override_failed_senate, became_law]
      - name: first_date
        data_tests: [not_null]
      - name: last_date
        data_tests: [not_null]

  - name: positions
    description: One row per member per vote.
    columns:
      - name: vote_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('votes')
                field: vote_id
      - name: bioguide_id
        description: Null only if a Senate LIS ID couldn't be matched; the not_null test fails in that case (relationships skips nulls).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('members')
                field: bioguide_id
      - name: member_label
        data_tests: [not_null]
      - name: position_raw
        description: Position as officially recorded (Yea, Aye, Nay, No, Present, Not Voting, or a candidate name).
        data_tests: [not_null]
      - name: position
        description: Normalized position.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["yes", "no", "present", "not_voting", "other"]
      - name: party
        description: Party in effect on the vote date, from congress-legislators.
        data_tests:
          - accepted_values:
              arguments:
                values: ["R", "D", "I"]
      - name: caucus_party
        description: Caucus in effect on the vote date; independents grouped with the party they caucus with.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["R", "D"]
      - name: state
        description: State of the seat held on the vote date, from congress-legislators.
        data_tests: [not_null]
      - name: district
        description: House district of the seat held on the vote date (0 for at-large seats and delegates); null for senators.
      - name: term_covers_vote_date
        description: >
          False when the official record lists the member on a date outside their term dates in
          congress-legislators; party, caucus, seat, and label then come from the nearest term.
        data_tests: [not_null]
      - name: caucus_majority_position
        description: The member's caucus majority on this vote (yes/no), or null on a tie or a non-yes/no vote.
        data_tests:
          - accepted_values:
              arguments:
                values: ["yes", "no"]
      - name: voted_against_party_majority
        description: >
          True when the member voted yes/no opposite to their caucus majority; false when
          with it; null when the member did not vote yes/no or the caucus had no majority.
