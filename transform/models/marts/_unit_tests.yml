    given:
      - input: ref('int_member_periods')
        rows:
          - {bioguide_id: C1, chamber: senate, state: VT, party: D, caucus_party: D, member_label: "One (D-VT)", period_start: "2025-01-03", period_end: "2031-01-03", overlaps_site_congress: true}
          - {bioguide_id: C2, chamber: house, state: CA, district: 3, party: R, caucus_party: R, member_label: "Two (R-CA-3)", period_start: "2025-01-03", period_end: "2027-01-03", overlaps_site_congress: true}
          - {bioguide_id: F1, chamber: house, state: TX, district: 9, party: D, caucus_party: D, member_label: "Former (D-TX-9)", period_start: "2025-01-03", period_end: "2025-06-01", overlaps_site_congress: true}
      - input: ref('int_positions_resolved')
        rows: []
