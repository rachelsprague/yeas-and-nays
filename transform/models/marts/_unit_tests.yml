version: 2

unit_tests:
  - name: caucus_majority_handles_breaks_ties_and_non_votes
    description: >
      Majority counts only yes/no. A tie, or a vote with no yes/no positions at
      all (quorum call, Speaker election), has no majority.
    model: int_caucus_majority
    given:
      - input: ref('int_positions_resolved')
        rows:
          # v1: R 2-1 yes, D 0-2 no
          - {vote_id: v1, caucus_party: R, position: "yes"}
          - {vote_id: v1, caucus_party: R, position: "yes"}
          - {vote_id: v1, caucus_party: R, position: "no"}
          - {vote_id: v1, caucus_party: R, position: present}
          # An independent caucusing with D counts toward the D majority
          - {vote_id: v1, party: I, caucus_party: D, position: "no"}
          - {vote_id: v1, caucus_party: D, position: "no"}
          - {vote_id: v1, caucus_party: D, position: "no"}
          - {vote_id: v1, caucus_party: D, position: not_voting}
          # v2: D tied 1-1
          - {vote_id: v2, caucus_party: D, position: "yes"}
          - {vote_id: v2, caucus_party: D, position: "no"}
          # v3: Speaker election, candidate names only
          - {vote_id: v3, caucus_party: R, position: other}
          - {vote_id: v3, caucus_party: R, position: present}
    expect:
      rows:
        - {vote_id: v1, caucus_party: R, yes_count: 2, no_count: 1, majority_position: "yes"}
        - {vote_id: v1, caucus_party: D, yes_count: 0, no_count: 3, majority_position: "no"}
        - {vote_id: v2, caucus_party: D, yes_count: 1, no_count: 1, majority_position: null}
        - {vote_id: v3, caucus_party: R, yes_count: 0, no_count: 0, majority_position: null}

  - name: positions_flag_is_null_unless_member_voted_yes_or_no_against_a_majority
    model: positions
    given:
      - input: ref('int_positions_resolved')
        rows:
          - {vote_id: v1, bioguide_id: A1, caucus_party: R, position: "yes"}
          - {vote_id: v1, bioguide_id: A2, caucus_party: R, position: "no"}
          - {vote_id: v1, bioguide_id: A3, caucus_party: R, position: present}
          - {vote_id: v1, bioguide_id: A4, caucus_party: R, position: not_voting}
          - {vote_id: v2, bioguide_id: A1, caucus_party: D, position: "yes"}
          - {vote_id: v3, bioguide_id: A1, caucus_party: R, position: other}
          # Independent caucusing with R votes with the R majority, opposite the D majority
          - {vote_id: v4, bioguide_id: I1, party: I, caucus_party: R, position: "yes"}
          - {vote_id: v4, bioguide_id: D1, party: D, caucus_party: D, position: "no"}
      - input: ref('int_caucus_majority')
        rows:
          - {vote_id: v1, caucus_party: R, majority_position: "yes"}
          - {vote_id: v2, caucus_party: D, majority_position: null}
          - {vote_id: v3, caucus_party: R, majority_position: null}
          - {vote_id: v4, caucus_party: R, majority_position: "yes"}
          - {vote_id: v4, caucus_party: D, majority_position: "no"}
    expect:
      rows:
        - {vote_id: v1, bioguide_id: A1, caucus_majority_position: "yes", voted_against_party_majority: false}
        - {vote_id: v1, bioguide_id: A2, caucus_majority_position: "yes", voted_against_party_majority: true}
        - {vote_id: v1, bioguide_id: A3, caucus_majority_position: "yes", voted_against_party_majority: null}
        - {vote_id: v1, bioguide_id: A4, caucus_majority_position: "yes", voted_against_party_majority: null}
        - {vote_id: v2, bioguide_id: A1, caucus_majority_position: null, voted_against_party_majority: null}
        - {vote_id: v3, bioguide_id: A1, caucus_majority_position: null, voted_against_party_majority: null}
        - {vote_id: v4, bioguide_id: I1, caucus_majority_position: "yes", voted_against_party_majority: false}
        - {vote_id: v4, bioguide_id: D1, caucus_majority_position: "no", voted_against_party_majority: false}

  - name: member_periods_resolve_independent_caucus_and_mid_term_switch
    description: >
      An independent caucusing with Democrats is grouped with D. A member who
      changed party mid-term gets one period per affiliation. A term that ended
      when the 119th began is kept but doesn't overlap it.
    model: int_member_periods
    given:
      - input: ref('stg_legislators__terms')
        rows:
          # Independent senator caucusing with Democrats
          - {bioguide_id: S1, chamber: senate, term_start: "2025-01-03", term_end: "2031-01-03", state: VT, district: null, party: I, caucus: D}
          # Previous term, ended when the 119th began: kept, not overlapping
          - {bioguide_id: S1, chamber: senate, term_start: "2019-01-03", term_end: "2025-01-03", state: VT, district: null, party: I, caucus: D}
          # House member who switched from R to I (caucusing R) mid-term
          - {bioguide_id: H1, chamber: house, term_start: "2025-01-03", term_end: "2027-01-03", state: CA, district: 3, party: I, caucus: R}
          # At-large House member
          - {bioguide_id: H2, chamber: house, term_start: "2025-01-03", term_end: "2027-01-03", state: WY, district: 0, party: R, caucus: null}
      - input: ref('stg_legislators__party_affiliations')
        rows:
          - {bioguide_id: H1, term_start: "2025-01-03", affiliation_start: "2025-01-03", affiliation_end: "2026-03-08", party: R, caucus: null}
          - {bioguide_id: H1, term_start: "2025-01-03", affiliation_start: "2026-03-09", affiliation_end: "2027-01-03", party: I, caucus: R}
      - input: ref('stg_legislators__people')
        rows:
          - {bioguide_id: S1, last_name: Senator}
          - {bioguide_id: H1, last_name: Member}
          - {bioguide_id: H2, last_name: Atlarge}
    expect:
      rows:
        - {bioguide_id: S1, period_start: "2025-01-03", party: I, caucus_party: D, overlaps_congress: true, member_label: "Senator (I-VT)"}
        - {bioguide_id: S1, period_start: "2019-01-03", party: I, caucus_party: D, overlaps_congress: false, member_label: "Senator (I-VT)"}
        - {bioguide_id: H1, period_start: "2025-01-03", party: R, caucus_party: R, overlaps_congress: true, member_label: "Member (R-CA-3)"}
        - {bioguide_id: H1, period_start: "2026-03-09", party: I, caucus_party: R, overlaps_congress: true, member_label: "Member (I-CA-3)"}
        - {bioguide_id: H2, period_start: "2025-01-03", party: R, caucus_party: R, overlaps_congress: true, member_label: "Atlarge (R-WY)"}

  - name: member_stats_count_missed_votes_and_party_agreement
    description: >
      Present counts as voting, not as missed. Agreement with the party majority
      counts only yes/no votes where the caucus had a majority.
    model: member_stats
    given:
      - input: ref('positions')
        rows:
          - {vote_id: v1, bioguide_id: A1, position: "yes", voted_against_party_majority: false}
          - {vote_id: v2, bioguide_id: A1, position: "no", voted_against_party_majority: true}
          - {vote_id: v3, bioguide_id: A1, position: "yes", voted_against_party_majority: false}
          - {vote_id: v4, bioguide_id: A1, position: present, voted_against_party_majority: null}
          - {vote_id: v5, bioguide_id: A1, position: not_voting, voted_against_party_majority: null}
          # Tie in the caucus: no majority, so excluded from agreement
          - {vote_id: v6, bioguide_id: A1, position: "yes", voted_against_party_majority: null}
          # Only ever absent
          - {vote_id: v1, bioguide_id: A2, position: not_voting, voted_against_party_majority: null}
    expect:
      rows:
        - {bioguide_id: A1, roll_calls: 6, votes_cast: 5, missed_votes: 1, party_majority_votes: 3,
           with_party_majority_votes: 2, against_party_majority_votes: 1,
           missed_votes_pct: 16.7, with_party_majority_pct: 66.7}
        - {bioguide_id: A2, roll_calls: 1, votes_cast: 0, missed_votes: 1, party_majority_votes: 0,
           with_party_majority_votes: 0, against_party_majority_votes: 0,
           missed_votes_pct: 100.0, with_party_majority_pct: null}

  - name: vote_summaries_use_the_version_in_effect_on_the_vote_date
    model: vote_summaries
    given:
      - input: ref('int_votes_unioned')
        rows:
          # Voted after the bill was reported, before it passed: the reported version
          - {vote_id: v1, vote_date: "2025-06-01", congress: 119, bill_type: hr, bill_number: "1"}
          # Voted before any summary existed: use the earliest later one
          - {vote_id: v2, vote_date: "2025-01-05", congress: 119, bill_type: hr, bill_number: "2"}
          # No summary at all: no row
          - {vote_id: v3, vote_date: "2025-06-10", congress: 119, bill_type: hres, bill_number: "3"}
          # Not a bill
          - {vote_id: v4, vote_date: "2025-06-10", congress: 119, bill_type: null, bill_number: null}
      - input: ref('stg_congress_gov__bill_summaries')
        rows:
          - {congress: 119, bill_type: hr, bill_number: "1", action_date: "2025-01-03", action_desc: Introduced in House}
          - {congress: 119, bill_type: hr, bill_number: "1", action_date: "2025-05-01", action_desc: Reported to House}
          - {congress: 119, bill_type: hr, bill_number: "1", action_date: "2025-06-10", action_desc: Passed House}
          - {congress: 119, bill_type: hr, bill_number: "2", action_date: "2025-02-01", action_desc: Introduced in House}
          - {congress: 119, bill_type: hr, bill_number: "2", action_date: "2025-03-01", action_desc: Passed House}
    expect:
      rows:
        - {vote_id: v1, action_desc: Reported to House}
        - {vote_id: v2, action_desc: Introduced in House}

  - name: latest_vote_per_bill_takes_the_most_recent_roll_call
    model: int_latest_vote_per_bill
    given:
      - input: ref('int_votes_unioned')
        rows:
          - {vote_id: h119-1-0010, congress: 119, bill_type: hr, bill_number: "1", vote_time_et: "2025-03-01 12:00:00"}
          - {vote_id: s119-1-0040, congress: 119, bill_type: hr, bill_number: "1", vote_time_et: "2025-05-01 12:00:00"}
          - {vote_id: h119-1-0011, congress: 119, bill_type: hr, bill_number: "10", vote_time_et: "2025-06-01 12:00:00"}
          - {vote_id: s119-1-0041, congress: 119, bill_type: null, bill_number: null, vote_time_et: "2025-06-02 12:00:00"}
    expect:
      rows:
        - {vote_id: s119-1-0040, bill_type: hr, bill_number: "1"}
        - {vote_id: h119-1-0011, bill_type: hr, bill_number: "10"}

  - name: sponsored_bills_link_the_most_recent_vote_on_each_bill
    model: sponsored_bills
    given:
      - input: ref('stg_congress_gov__sponsored_bills')
        rows:
          - {bioguide_id: A1, congress: 119, bill_type: hr, bill_number: "1"}
          - {bioguide_id: A1, congress: 119, bill_type: hres, bill_number: "2"}
      - input: ref('int_latest_vote_per_bill')
        rows:
          - {vote_id: s119-1-0040, congress: 119, bill_type: hr, bill_number: "1"}
          - {vote_id: h119-1-0011, congress: 119, bill_type: hr, bill_number: "10"}
    expect:
      rows:
        - {bioguide_id: A1, bill_id: 119-hr-1, latest_vote_id: s119-1-0040}
        - {bioguide_id: A1, bill_id: 119-hres-2, latest_vote_id: null}

  - name: cosponsored_bills_link_the_most_recent_vote_on_each_bill
    model: cosponsored_bills
    given:
      - input: ref('stg_congress_gov__cosponsored_bills')
        rows:
          - {bioguide_id: A1, congress: 119, bill_type: s, bill_number: "7"}
          - {bioguide_id: B2, congress: 119, bill_type: s, bill_number: "7"}
          - {bioguide_id: B2, congress: 119, bill_type: sres, bill_number: "3"}
      - input: ref('int_latest_vote_per_bill')
        rows:
          - {vote_id: s119-1-0050, congress: 119, bill_type: s, bill_number: "7"}
    expect:
      rows:
        - {bioguide_id: A1, bill_id: 119-s-7, latest_vote_id: s119-1-0050}
        - {bioguide_id: B2, bill_id: 119-s-7, latest_vote_id: s119-1-0050}
        - {bioguide_id: B2, bill_id: 119-sres-3, latest_vote_id: null}

  - name: cloture_events_parse_the_senate_status_lines
    model: int_senate_cloture_events
    given:
      - input: ref('stg_floor__senate_actions')
        rows:
          - {docnum: H.R. 1, status_text: "Cloture motion on the motion to proceed to the measure presented in Senate."}
          - {docnum: H.R. 1, status_text: "Cloture on the motion to proceed to the measure invoked in Senate by Yea-Nay Vote. 73 - 25. Record Vote Number:"}
          - {docnum: H.R. 1, status_text: "Cloture on the measure, as amended, not invoked in Senate by Yea-Nay Vote. 52 - 46. Record Vote Number:"}
          - {docnum: S.Amdt. 9, status_text: "Cloture motion on amendment SA 9 presented in Senate."}
          - {docnum: PN1, status_text: "Cloture motion presented in Senate."}
          - {docnum: PN1, status_text: "Cloture invoked in Senate by Yea-Nay Vote. 50 - 44. Record Vote Number:"}
          - {docnum: PN2, status_text: "Cloture motion withdrawn by unanimous consent in Senate."}
          - {docnum: PN3, status_text: "Confirmed by the Senate by Voice Vote."}
          - {docnum: H.R. 2, status_text: "Passed Senate without amendment by Unanimous Consent."}
          - {docnum: S.Amdt. 7, status_text: "Amendment SA 7 agreed to in Senate by Unanimous Consent."}
          # Not cloture events
          - {docnum: H.R. 1, status_text: "Considered by Senate."}
          - {docnum: S.Amdt. 8, status_text: "SA 8 fell when cloture invoked on amendment SA 9."}
          - {docnum: PN4, status_text: "Motion to proceed to executive session to consideration of nomination agreed to in Senate by Voice Vote."}
    expect:
      rows:
        - {docnum: H.R. 1, event: filed, target: the motion to proceed to the measure}
        - {docnum: H.R. 1, event: voted, target: the motion to proceed to the measure}
        - {docnum: H.R. 1, event: voted, target: the measure}
        - {docnum: S.Amdt. 9, event: filed, target: amendment SA 9}
        - {docnum: PN1, event: filed, target: ""}
        - {docnum: PN1, event: voted, target: ""}
        - {docnum: PN2, event: withdrawn, target: ""}
        - {docnum: PN3, event: disposed, target: null}
        - {docnum: H.R. 2, event: disposed, target: null}
        - {docnum: S.Amdt. 7, event: disposed, target: null}

  - name: floor_schedule_keeps_filed_cloture_motions_and_links_the_vote_that_followed
    description: >
      A cloture motion is listed until a later status line records the vote or disposes of
      the document; a roll call on it can arrive first and is linked. House items removed
      from the schedule drop out, and a House item links the first deciding vote on the
      measure in its week, not procedural votes before it.
    model: floor_schedule
    given:
      - input: ref('stg_floor__house_items')
        rows:
          - {congress: 119, week_date: 2026-11-09, item_id: "1", measure_number: H.R. 5, bill_type: hr, bill_number: "5", title: A, removed_at: null}
          - {congress: 119, week_date: 2026-11-09, item_id: "2", measure_number: H.R. 6, bill_type: hr, bill_number: "6", title: B, removed_at: "2026-11-10 09:00:00"}
          - {congress: 119, week_date: 2026-11-09, item_id: "3", measure_number: H.R. 7, bill_type: hr, bill_number: "7", title: C, removed_at: null}
      - input: ref('int_senate_cloture_events')
        rows:
          # PN1: filed, then voted per the floor record -> not listed
          - {docnum: PN1, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-09, status_order: 0, document_title: N1}
          - {docnum: PN1, document_prefix: PN, target: "", event: voted, activity_date: 2026-11-11, status_order: 0, document_title: N1}
          # PN2: filed; the roll call is in, the floor record isn't yet -> listed with the vote
          - {docnum: PN2, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-10, status_order: 0, document_title: N2}
          # H.R. 9: cloture on the motion to proceed voted; cloture on the measure filed
          - {docnum: H.R. 9, document_prefix: HR, bill_type: hr, bill_number: "9", target: the motion to proceed to the measure, event: filed, activity_date: 2026-11-05, status_order: 0, document_title: B9}
          - {docnum: H.R. 9, document_prefix: HR, bill_type: hr, bill_number: "9", target: the motion to proceed to the measure, event: voted, activity_date: 2026-11-09, status_order: 0, document_title: B9}
          # ...and re-filed the same day an earlier cloture vote on the measure failed
          - {docnum: H.R. 9, document_prefix: HR, bill_type: hr, bill_number: "9", target: the measure, event: voted, activity_date: 2026-11-11, status_order: 0, document_title: B9}
          - {docnum: H.R. 9, document_prefix: HR, bill_type: hr, bill_number: "9", target: the measure, event: filed, activity_date: 2026-11-11, status_order: 1, document_title: B9}
          # PN3: filed, then confirmed by voice vote with no cloture vote -> not listed
          - {docnum: PN3, document_prefix: PN, target: "", event: filed, activity_date: 2026-11-10, status_order: 0, document_title: N3}
          - {docnum: PN3, document_prefix: PN, target: null, event: disposed, activity_date: 2026-11-12, status_order: 0, document_title: N3}
          # Cloture on an amendment links the roll call on that amendment
          - {docnum: S.Amdt. 9, document_prefix: SA, target: amendment SA 9, event: filed, activity_date: 2026-11-10, status_order: 0, document_title: A9}
          # H.R. 4: cloture on the measure and on a committee substitute; only the measure's is matched
          - {docnum: H.R. 4, document_prefix: HR, bill_type: hr, bill_number: "4", target: the measure, event: filed, activity_date: 2026-11-10, status_order: 0, document_title: B4}
          - {docnum: H.R. 4, document_prefix: HR, bill_type: hr, bill_number: "4", target: the committee-reported substitute, event: filed, activity_date: 2026-11-10, status_order: 1, document_title: B4}
      - input: ref('int_votes_unioned')
        rows:
          # H.R. 5: an amendment vote, then passage; the item links passage
          - {vote_id: h119-2-0001, chamber: house, congress: 119, bill_type: hr, bill_number: "5", question: On Agreeing to the Amendment, vote_date: 2026-11-10, vote_time_et: "2026-11-10 14:00:00"}
          - {vote_id: h119-2-0002, chamber: house, congress: 119, bill_type: hr, bill_number: "5", question: On Passage, vote_date: 2026-11-11, vote_time_et: "2026-11-11 14:00:00"}
          - {vote_id: h119-2-0003, chamber: house, congress: 119, bill_type: hr, bill_number: "5", question: On Motion to Reconsider, vote_date: 2026-11-11, vote_time_et: "2026-11-11 15:00:00"}
          # A vote on H.R. 7 the week before doesn't count
          - {vote_id: h119-2-0000, chamber: house, congress: 119, bill_type: hr, bill_number: "7", question: On Passage, vote_date: 2026-11-04, vote_time_et: "2026-11-04 14:00:00"}
          - {vote_id: s119-2-0010, chamber: senate, congress: 119, measure_number: PN2, question: On the Cloture Motion PN2, vote_date: 2026-11-12, vote_time_et: "2026-11-12 13:00:00"}
          # Cloture on the motion to proceed doesn't settle cloture on the measure
          - {vote_id: s119-2-0009, chamber: senate, congress: 119, measure_number: H.R. 9, question: On Cloture on the Motion to Proceed H.R. 9, vote_date: 2026-11-09, vote_time_et: "2026-11-09 17:00:00"}
          # The failed cloture vote on H.R. 9 the day it was re-filed
          - {vote_id: s119-2-0011, chamber: senate, congress: 119, measure_number: H.R. 9, question: On the Cloture Motion H.R. 9, vote_date: 2026-11-11, vote_time_et: "2026-11-11 12:00:00"}
          - {vote_id: s119-2-0012, chamber: senate, congress: 119, amendment_number: S.Amdt. 9, question: On the Cloture Motion S.Amdt. 9, vote_date: 2026-11-12, vote_time_et: "2026-11-12 14:00:00"}
          - {vote_id: s119-2-0013, chamber: senate, congress: 119, measure_number: H.R. 4, question: On the Cloture Motion H.R. 4, vote_date: 2026-11-12, vote_time_et: "2026-11-12 15:00:00"}
    expect:
      rows:
        - {item_id: h-2026-11-09-1, vote_id: h119-2-0002, question: null}
        - {item_id: h-2026-11-09-3, vote_id: null, question: null}
        - {item_id: s-PN2, vote_id: s119-2-0010, question: On the Cloture Motion}
        - {item_id: s-H.R. 9-measure, vote_id: null, question: On the Cloture Motion}
        - {item_id: s-S.Amdt. 9, vote_id: s119-2-0012, question: On the Cloture Motion}
        - {item_id: s-H.R. 4-measure, vote_id: s119-2-0013, question: On the Cloture Motion}
        - {item_id: s-H.R. 4-the-committee-reported-substitute, vote_id: null, question: On the Cloture Motion}
