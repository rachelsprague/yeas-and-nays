  - name: votes_set_the_share_and_yeas_each_question_needs
    description: >
      Senate votes take the share they record; House votes take two-thirds
      when the Clerk's vote type is 2/3 (an expulsion) or to suspend the rules,
      override a veto or propose a constitutional amendment, and a majority
      otherwise (a motion to table an expulsion). Yeas needed: more than half,
      or at least two-thirds, of yea plus nay; three-fifths of the senators on
      the roll, none with no roll. Nothing for a vote with no yea or nay votes
      (a quorum call, a Speaker election).
    model: votes
    given:
      - input: ref('int_votes_unioned')
        rows:
          - {vote_id: h1, chamber: house, question: On Passage, yea_count: 215, nay_count: 209}
          - {vote_id: h2, chamber: house, question: On Passage, yea_count: 210, nay_count: 210}
          - {vote_id: h3, chamber: house, question: "On Motion to Suspend the Rules and Pass, as Amended", yea_count: 280, nay_count: 140}
          - {vote_id: h4, chamber: house, question: "Passage, Objections of the President To The Contrary Notwithstanding", yea_count: 281, nay_count: 140}
          - {vote_id: h5, chamber: house, question: On Passage, measure_title: Proposing an amendment to the Constitution of the United States relative to X, yea_count: 300, nay_count: 100}
          - {vote_id: h6, chamber: house, question: Election of the Speaker, result: Smith}
          - {vote_id: h7, chamber: house, question: Call of the House, yea_count: 0, nay_count: 0}
          - {vote_id: h8, chamber: house, question: On Agreeing to the Resolution, vote_type: 2/3 YEA-AND-NAY, yea_count: 311, nay_count: 114}
          - {vote_id: h9, chamber: house, question: On Motion to Table, vote_type: YEA-AND-NAY, yea_count: 325, nay_count: 103}
          - {vote_id: s1, chamber: senate, question: On the Cloture Motion, majority_requirement: "3/5", yea_count: 2, nay_count: 1}
          - {vote_id: s2, chamber: senate, question: On the Nomination, majority_requirement: "1/2", yea_count: 50, nay_count: 49}
          - {vote_id: s3, chamber: senate, question: On Overriding the Veto, majority_requirement: "2/3", yea_count: 66, nay_count: 34}
          - {vote_id: s4, chamber: senate, question: On the Cloture Motion, majority_requirement: "3/5", yea_count: 2, nay_count: 1}
      - input: ref('bills')
        rows: []
      # Four senators on the roll for s1: three-fifths is 2.4, so 3 Yeas. None for s4.
      - input: ref('positions')
        rows:
          - {vote_id: s1, bioguide_id: A}
          - {vote_id: s1, bioguide_id: B}
          - {vote_id: s1, bioguide_id: C}
          - {vote_id: s1, bioguide_id: D}
      - input: ref('int_positions_resolved')
        rows: []
    expect:
      rows:
        - {vote_id: h1, required_share: "1/2", yeas_needed: 213}
        - {vote_id: h2, required_share: "1/2", yeas_needed: 211}
        - {vote_id: h3, required_share: "2/3", yeas_needed: 280}
        - {vote_id: h4, required_share: "2/3", yeas_needed: 281}
        - {vote_id: h5, required_share: "2/3", yeas_needed: 267}
        - {vote_id: h6, required_share: null, yeas_needed: null}
        - {vote_id: h7, required_share: null, yeas_needed: null}
        - {vote_id: h8, required_share: "2/3", yeas_needed: 284}
        - {vote_id: h9, required_share: "1/2", yeas_needed: 215}
        - {vote_id: s1, required_share: "3/5", yeas_needed: 3}
        - {vote_id: s2, required_share: "1/2", yeas_needed: 50}
        - {vote_id: s3, required_share: "2/3", yeas_needed: 67}
        - {vote_id: s4, required_share: "3/5", yeas_needed: null}

  - name: votes_read_carried_and_drop_yeas_needed_the_result_contradicts
    description: >
      Carried comes from the official result, any "Not" read as not carried
      ("Not Sustained", "Not Agreed to"); a Speaker's name is neither. Yeas
      needed is left out when the result disagrees with it (a 3/5 waiver
      agreed to short of three-fifths, a majority vote rejected with enough
      Yeas), but kept for a tie the Vice President broke and for a vote whose
      result isn't a yes or no.
    model: votes
    given:
      - input: ref('int_votes_unioned')
        rows:
          - {vote_id: s1, chamber: senate, majority_requirement: "3/5", result: Motion Agreed to, yea_count: 2, nay_count: 1}
          - {vote_id: s2, chamber: senate, majority_requirement: "1/2", result: Nomination Confirmed, yea_count: 50, nay_count: 50, tie_breaker_by: Vice President of the United States}
          - {vote_id: s3, chamber: senate, majority_requirement: "1/2", result: Amendment Rejected, yea_count: 60, nay_count: 40}
          - {vote_id: s4, chamber: senate, majority_requirement: "1/2", result: Decision of Chair Not Sustained, yea_count: 40, nay_count: 59}
          - {vote_id: s5, chamber: senate, majority_requirement: "1/2", result: Point of Order Well Taken, yea_count: 51, nay_count: 47}
          - {vote_id: s6, chamber: senate, majority_requirement: "1/2", result: Motion Not Agreed to, yea_count: 45, nay_count: 50}
          - {vote_id: h1, chamber: house, result: Passed, yea_count: 215, nay_count: 209}
          - {vote_id: h2, chamber: house, result: Failed, yea_count: 210, nay_count: 210}
          - {vote_id: h3, chamber: house, result: Smith, yea_count: 1, nay_count: 0}
      - input: ref('bills')
        rows: []
      # Five senators on the roll for s1: three-fifths is 3 Yeas.
      - input: ref('positions')
        rows:
          - {vote_id: s1, bioguide_id: A}
          - {vote_id: s1, bioguide_id: B}
          - {vote_id: s1, bioguide_id: C}
          - {vote_id: s1, bioguide_id: D}
          - {vote_id: s1, bioguide_id: E}
      - input: ref('int_positions_resolved')
        rows: []
    expect:
      rows:
        - {vote_id: s1, carried: true, yeas_needed: null}
        - {vote_id: s2, carried: true, yeas_needed: 51}
        - {vote_id: s3, carried: false, yeas_needed: null}
        - {vote_id: s4, carried: false, yeas_needed: 50}
        - {vote_id: s5, carried: true, yeas_needed: 50}
        - {vote_id: s6, carried: false, yeas_needed: 48}
        - {vote_id: h1, carried: true, yeas_needed: 213}
        - {vote_id: h2, carried: false, yeas_needed: 211}
        - {vote_id: h3, carried: null, yeas_needed: 1}

  - name: member_bios_match_by_name_and_seat
    description: >
      Biographies match by chamber, state and last name as whole words, accents and
      punctuation aside; on the member's own seat the first word of a two-word last name
      will do. A member whose first term in the chamber began after the edition can't take
      a predecessor's biography through a shared surname, and a redistricted member keeps
      theirs.
    model: member_bios
    given:
      - input: ref('stg_directory__bios')
        rows:
          - {edition: CDIR-2026-02-20, date_issued: 2026-02-20, state: SC, chamber: senate, district: null, printed_name: "PAT GREY", opening: "of Town, SC"}
          - {edition: CDIR-2026-02-20, date_issued: 2026-02-20, state: CA, chamber: house, district: 5, printed_name: "LINDA T. SÁNCHEZ", opening: "of Whittier, CA"}
          - {edition: CDIR-2026-02-20, date_issued: 2026-02-20, state: PR, chamber: house, district: 0, printed_name: "PABLO JOSE HERNANDEZ", opening: "Resident Commissioner of Puerto Rico"}
          - {edition: CDIR-2026-02-20, date_issued: 2026-02-20, state: CA, chamber: house, district: 9, printed_name: "SAM KAMLAGER-DOVE", opening: "of Los Angeles, CA"}
          - {edition: CDIR-2026-02-20, date_issued: 2026-02-20, state: CA, chamber: house, district: 7, printed_name: "JO GREYSON", opening: "of Fresno, CA"}
      - input: ref('members')
        rows:
          - {bioguide_id: S1, state: SC, chamber: senate, district: null, last_name: Grey, chamber_first_term_start: 2015-01-03}
          # Took the seat after the edition; a shared surname doesn't give her his biography.
          - {bioguide_id: S2, state: SC, chamber: senate, district: null, last_name: Grey Nordone, chamber_first_term_start: 2026-07-14}
          - {bioguide_id: H1, state: CA, chamber: house, district: 5, last_name: Sánchez, chamber_first_term_start: 2003-01-07}
          - {bioguide_id: H2, state: PR, chamber: house, district: 0, last_name: Hernández Rivera, chamber_first_term_start: 2025-01-03}
          # Redistricted from the 9th to the 11th: the name still matches.
          - {bioguide_id: H3, state: CA, chamber: house, district: 11, last_name: Kamlager-Dove, chamber_first_term_start: 2023-01-03}
          # "GREYSON" isn't "Grey" as a whole word.
          - {bioguide_id: H4, state: CA, chamber: house, district: 8, last_name: Grey, chamber_first_term_start: 2021-01-03}
    expect:
      rows:
        - {bioguide_id: S1, printed_name: "PAT GREY"}
        - {bioguide_id: H1, printed_name: "LINDA T. SÁNCHEZ"}
        - {bioguide_id: H2, printed_name: "PABLO JOSE HERNANDEZ"}
        - {bioguide_id: H3, printed_name: "SAM KAMLAGER-DOVE"}
